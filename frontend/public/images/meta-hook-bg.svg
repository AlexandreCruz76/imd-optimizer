<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="100%" stop-color="#0a101a"/>
    </linearGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d47a" stop-opacity="0.08"/>
      <stop offset="100%" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="1920" height="1080" fill="url(#bg)"/>
  
  <!-- Pool central sutil -->
  <circle cx="960" cy="540" r="400" fill="url(#pool)"/>
  <circle cx="960" cy="540" r="400" fill="none" stroke="#00d47a" stroke-width="1" opacity="0.15"/>
  
  <!-- 4 hexágonos essenciais -->
  <g stroke="#00d47a" stroke-width="1" fill="none" opacity="0.2">
    <path d="M960 180l150 75v150l-150 75-150-75v-150z"/>
    <path d="M960 500l150 75v150l-150 75-150-75v-150z"/>
    <path d="M660 340l150 75v150l-150 75-150-75v-150z"/>
    <path d="M1260 340l150 75v150l-150 75-150-75v-150z"/>
  </g>
  
  <!-- Hooks dourados (anti-MEV) -->
  <g stroke="#e8b800" stroke-width="2" fill="none" opacity="0.5">
    <path d="M960 140q0 40 60 70 M960 140q0 40-60 70"/>
    <path d="M960 940q0-40 60-70 M960 940q0-40-60-70"/>
  </g>
  
  <!-- Fluxo arbitragem (ciano) -->
  <g stroke="#00e5e5" stroke-width="1.5" fill="none" opacity="0.35" stroke-dasharray="20,12">
    <path d="M510 400q225 0 450 100 225 75 450 75"/>
    <path d="M1410 575q-225 0-450-75-225-75-450-75"/>
  </g>
</svg>