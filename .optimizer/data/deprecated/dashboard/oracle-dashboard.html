<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimizer Oracle - MEV Intelligence Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-bottom: 2px solid #00ff88;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .logo-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #00ff88, #00cc6a);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: #0a0a0f;
    }
    .logo h1 {
      font-size: 24px;
      background: linear-gradient(90deg, #00ff88, #00cc6a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo p { font-size: 12px; color: #888; }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid #00ff88;
      border-radius: 20px;
      font-size: 14px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      background: #00ff88;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .dashboard {
      padding: 30px 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    .card {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border: 1px solid #333;
      border-radius: 16px;
      padding: 24px;
      transition: all 0.3s ease;
    }
    .card:hover {
      border-color: #00ff88;
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0, 255, 136, 0.1);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }
    .card-badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-green { background: rgba(0, 255, 136, 0.2); color: #00ff88; }
    .badge-yellow { background: rgba(255, 200, 0, 0.2); color: #ffc800; }
    .badge-red { background: rgba(255, 68, 68, 0.2); color: #ff4444; }
    .metric {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #333;
    }
    .metric:last-child { border-bottom: none; }
    .metric-label { color: #888; font-size: 14px; }
    .metric-value { font-size: 18px; font-weight: 600; color: #00ff88; }
    .metric-value.large { font-size: 28px; }
    .trader-list {
      max-height: 200px;
      overflow-y: auto;
    }
    .trader-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #222;
    }
    .trader-addr {
      font-family: monospace;
      font-size: 13px;
      color: #aaa;
    }
    .trader-count {
      background: rgba(0, 255, 136, 0.1);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: #00ff88;
    }
    .cross-pool-section {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #1a1a2e 0%, #0d1f2d 100%);
      border: 1px solid #00ff88;
    }
    .bot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .bot-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .bot-card:hover { border-color: #00ff88; }
    .bot-addr {
      font-family: monospace;
      font-size: 12px;
      color: #00ff88;
      word-break: break-all;
    }
    .bot-label {
      font-size: 11px;
      color: #666;
      margin-top: 6px;
    }
    .refresh-btn {
      background: linear-gradient(135deg, #00ff88, #00cc6a);
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      color: #0a0a0f;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .refresh-btn:hover { transform: scale(1.05); }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .last-update {
      font-size: 12px;
      color: #666;
      text-align: right;
      margin-top: 10px;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #888;
    }
    .spinner {
      border: 3px solid #333;
      border-top: 3px solid #00ff88;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .oracle-output {
      grid-column: 1 / -1;
      background: #0d0d12;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 24px;
    }
    .oracle-output pre {
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      color: #00ff88;
      overflow-x: auto;
      white-space: pre-wrap;
    }
    .section-title {
      font-size: 14px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">O</div>
      <div>
        <h1>Optimizer Oracle</h1>
        <p>MEV Threat Intelligence Node</p>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 20px;">
      <div class="status-badge">
        <div class="status-dot"></div>
        <span id="status">Connecting...</span>
      </div>
      <button class="refresh-btn" onclick="fetchData()" id="refreshBtn">Refresh</button>
    </div>
  </div>

  <div class="dashboard" id="dashboard">
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading blockchain data...</p>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3001';

    async function fetchData() {
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.textContent = 'Loading...';

      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        renderDashboard(data);
        document.getElementById('status').textContent = 'Live';
      } catch (e) {
        document.getElementById('status').textContent = 'Offline';
        document.getElementById('dashboard').innerHTML = `
          <div class="card" style="grid-column: 1 / -1; text-align: center;">
            <p style="color: #ff4444;">Error connecting to Oracle API</p>
            <p style="color: #666; margin-top: 10px;">Make sure oracle-api.js is running on port 3001</p>
          </div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Refresh';
      }
    }

    function renderDashboard(data) {
      const imd = data.imd || {};
      const std = data.standard || {};
      const cross = data.cross_pool || {};

      document.getElementById('dashboard').innerHTML = `
        <!-- IMD Pool -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">Pool IMD/ETH</span>
            <span class="card-badge badge-green">ACTIVE</span>
          </div>
          <div class="metric">
            <span class="metric-label">Total Swaps</span>
            <span class="metric-value large">${imd.swaps || 0}</span>
          </div>
          <div class="metric">
            <span class="metric-label">Unique Traders</span>
            <span class="metric-value">${imd.traders || 0}</span>
          </div>
          <div class="section-title" style="margin-top: 20px;">Top Traders</div>
          <div class="trader-list">
            ${(imd.top5 || []).map(t => `
              <div class="trader-item">
                <span class="trader-addr">${t.addr.substring(0, 10)}...${t.addr.substring(38)}</span>
                <span class="trader-count">${t.swaps} swaps</span>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Standard Pool -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">Standard (ETH/USDC)</span>
            <span class="card-badge badge-green">ACTIVE</span>
          </div>
          <div class="metric">
            <span class="metric-label">Total Swaps</span>
            <span class="metric-value large">${std.swaps || 0}</span>
          </div>
          <div class="metric">
            <span class="metric-label">Unique Traders</span>
            <span class="metric-value">${std.traders || 0}</span>
          </div>
          <div class="section-title" style="margin-top: 20px;">Top Traders</div>
          <div class="trader-list">
            ${(std.top5 || []).map(t => `
              <div class="trader-item">
                <span class="trader-addr">${t.addr.substring(0, 10)}...${t.addr.substring(38)}</span>
                <span class="trader-count">${t.swaps} swaps</span>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Cross-Pool Intelligence -->
        <div class="card cross-pool-section">
          <div class="card-header">
            <span class="card-title">Cross-Pool Intelligence</span>
            <span class="card-badge badge-yellow">${cross.shared_bots || 0} BOTS DETECTED</span>
          </div>
          <div class="metric">
            <span class="metric-label">Shared Bots (IMD + Standard)</span>
            <span class="metric-value">${cross.shared_bots || 0}</span>
          </div>
          <div class="metric">
            <span class="metric-label">Arbitrage Signal</span>
            <span class="metric-value" style="color: ${cross.arbitrage_signal ? '#ffc800' : '#666'}">
              ${cross.arbitrage_signal ? 'ACTIVE' : 'NONE'}
            </span>
          </div>
          <div class="section-title" style="margin-top: 20px;">Bot Addresses Operating on Both Pools</div>
          <div class="bot-grid">
            ${(cross.addresses || []).map(addr => `
              <div class="bot-card">
                <div class="bot-addr">${addr}</div>
                <div class="bot-label">Cross-Pool Operator</div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Oracle Output -->
        <div class="oracle-output">
          <div class="card-header">
            <span class="card-title">Oracle JSON Output</span>
            <span class="card-badge badge-green">LIVE</span>
          </div>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        </div>

        <div class="last-update">
          Last update: ${data.timestamp || 'N/A'} | Block: ${data.last_block || 'N/A'}
        </div>
      `;
    }

    fetchData();
    setInterval(fetchData, 60000);
  </script>
</body>
</html>
